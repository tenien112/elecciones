name: elecciones
on:
  workflow_dispatch:
  push:
    paths: ["datos/actualizar.py", ".github/workflows/elecciones.yml"]
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: write
  pages: write
concurrency:
  group: elecciones
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Encuestas y apuestas
        run: python3 datos/actualizar.py
      - name: Guardar
        run: |
          git config user.name "RADAR ELECCIONES"
          git config user.email "actions@users.noreply.github.com"
          git add datos/datos.json datos/apuestas.json datos/registro.json
          git commit -m "RADAR ELECCIONES: datos actualizados" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Publicar la web (GitHub Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
